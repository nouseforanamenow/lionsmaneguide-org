name: Publish Scheduled Post

on:
  schedule:
    - cron: '0 15 * * 4'
  workflow_dispatch:

permissions:
  contents: write

# Promotes the oldest folder in blog/scheduled/ into blog/, then makes the blog
# index and the sitemap agree with it. Pushing is the deploy: this repo is the
# Git source of the Vercel project, so a commit here ships to lionsmaneguide.org.
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote the oldest queued post
        id: drain
        run: |
          # Alphabetical, not mtime: a fresh checkout gives every file the same
          # mtime, so sorting by time picks an arbitrary post.
          DIR=$(find blog/scheduled -mindepth 1 -maxdepth 1 -type d | sort | head -1)
          if [ -z "$DIR" ]; then
            echo "queue is empty, nothing to publish"
            echo "slug=" >> $GITHUB_OUTPUT
            exit 0
          fi
          SLUG=$(basename "$DIR")
          git mv "$DIR" "blog/$SLUG"
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "published blog/$SLUG/"

      - name: Add it to the blog index and the sitemap
        if: steps.drain.outputs.slug != ''
        env:
          SLUG: ${{ steps.drain.outputs.slug }}
          DOMAIN: lionsmaneguide.org
        run: |
          python3 - <<'PY'
          import os, re, datetime, pathlib

          slug = os.environ["SLUG"]
          domain = os.environ["DOMAIN"]
          today = datetime.date.today()
          post = pathlib.Path("blog") / slug / "index.html"
          html = post.read_text(errors="ignore")

          def strip(x):
              return re.sub(r"\s+", " ", re.sub(r"<[^>]+>", "", x)).strip()

          def first(*patterns, default=""):
              for p in patterns:
                  m = re.search(p, html, re.S | re.I)
                  if m:
                      return strip(m.group(1))
              return default

          title = re.split(r"\s*\|\s*", first(r"<h1[^>]*>(.*?)</h1>", r"<title>(.*?)</title>",
                                              default=slug))[0].strip()
          dek = first(r'<meta name="description" content="(.*?)"')
          iso = first(r'"datePublished":\s*"(\d{4}-\d{2}-\d{2})', default=today.isoformat())[:10]
          try:
              shown = datetime.date.fromisoformat(iso).strftime("%B %Y")
          except ValueError:
              iso, shown = today.isoformat(), today.strftime("%B %Y")

          idx = pathlib.Path("blog/index.html")
          page = idx.read_text()

          if f'href="/blog/{slug}/"' not in page:
              # Clone an existing card instead of hardcoding markup: every site in this
              # network has its own theme and its own card classes, so the only safe
              # template is the one already on the page.
              cards = [m for m in re.finditer(
                  r'<a\b[^>]*href="/blog/(?!"|\s)([^"]+)/"[^>]*>.*?</a>', page, re.S | re.I)]
              cards = [m for m in cards if m.group(1).strip()]
              if not cards:
                  raise SystemExit("blog index has no existing post card to copy")
              tpl, old_slug = cards[0].group(0), cards[0].group(1)

              card = tpl.replace(f'/blog/{old_slug}/', f'/blog/{slug}/')

              def set_text(block, pattern, value, count=1):
                  return re.sub(pattern, lambda m: m.group(1) + value + m.group(3), block,
                                count=count, flags=re.S | re.I)

              card = set_text(card, r"(<(?:h2|h3)\b[^>]*>)(.*?)(</(?:h2|h3)>)", title)
              if dek:
                  card = set_text(card, r"(<p\b[^>]*>)(.*?)(</p>)", dek)
              # whatever text node currently holds a "July 2026" style date, wherever it
              # sits: some themes print it alone, others inline with a read time
              card = re.sub(r"(>[^<]*?)((?:January|February|March|April|May|June|July|August|"
                            r"September|October|November|December) \d{4})",
                            lambda m: m.group(1) + shown, card, count=1)

              start = cards[0].start()
              line_start = page.rfind("\n", 0, start) + 1
              indent = page[line_start:start]
              page = page[:line_start] + indent + card + "\n" + page[line_start:]
              idx.write_text(page)
              print(f"blog index: card added (cloned from {old_slug})")

          sm = pathlib.Path("sitemap.xml")
          s = sm.read_text()
          loc = f"https://{domain}/blog/{slug}/"
          if loc not in s:
              s = s.replace("</urlset>",
                            f"  <url>\n    <loc>{loc}</loc>\n"
                            f"    <lastmod>{iso}</lastmod>\n"
                            "    <priority>0.7</priority>\n  </url>\n</urlset>")
          s = re.sub(r"(<loc>https://" + re.escape(domain) + r"/blog/</loc>\s*<lastmod>)[0-9-]{10}",
                     lambda m: m.group(1) + today.isoformat(), s)
          sm.write_text(s)
          print("sitemap: entry added, blog index lastmod bumped")
          PY

      - name: Commit
        if: steps.drain.outputs.slug != ''
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Publish scheduled post: ${{ steps.drain.outputs.slug }}"
            git push
          fi

      # Two ways this reaches production, and the workflow supports either.
      # If the repo is connected to the Vercel project through the Vercel
      # GitHub App, the push above IS the deploy and this step is skipped
      # because no token is set. Until then, a VERCEL_TOKEN secret lets the
      # CLI ship the same commit. Connect the app and the secret can be
      # deleted; nothing else changes.
      - name: Deploy to Vercel
        if: steps.drain.outputs.slug != '' && env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_5Og6Ko6QVyT9wVnPAReuS8cu
          VERCEL_PROJECT_ID: prj_9yLERm31Hln6eyCSxmVewQ6FUSna
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
